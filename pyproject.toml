[project]
name = "sdd-greenfield"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=26.0.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "hypothesis>=6.152.7",
    "pytest>=9.0.3",
    "pytest-flask>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
